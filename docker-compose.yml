services:
  db:
    image: postgres:16-alpine
    container_name: pawconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawconnect
      POSTGRES_PASSWORD: pawconnect
      POSTGRES_DB: pawconnect
    ports:
      - "5432:5432"
    volumes:
      - pawconnect_db_data:/var/lib/postgresql/data

volumes:
  pawconnect_db_data:
