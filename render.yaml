databases:
  - name: pawconnect-db
    databaseName: pawconnect
    user: pawconnect
    plan: free

services:
  - type: web
    name: pawconnect-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pawconnect-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: pawconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Se llenan manualmente en el panel de Render (ver README, seccion Despliegue)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: pawconnect-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      # URL publica de pawconnect-api, con el prefijo /api (ver README, seccion Despliegue)
      - key: NEXT_PUBLIC_API_URL
        sync: false
